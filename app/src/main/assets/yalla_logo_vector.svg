<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" width="100%" height="100%">
  <defs>
    <!-- Filter for smooth drop shadow -->
    <filter id="yallaDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#800000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Pure White / Transparent Background option -->
  <rect width="100%" height="100%" fill="none"/>

  <!-- Stacked Slanted 3D Yalla Yalla Graphic Group -->
  <g transform="skewX(-12) rotate(-2) translate(35, 10)" filter="url(#yallaDropShadow)">
    
    <!-- TOP "Yalla" 3D Shadow / Red-Orange Extrusion Block -->
    <g fill="#D82300" stroke="#A01500" stroke-width="2" stroke-linejoin="round">
      <path d="M 45,115 L 55,125 L 115,125 L 155,55 L 145,45 Z" />
      <path d="M 140,125 L 150,135 L 245,135 L 235,125 Z" />
      <path d="M 230,125 L 240,135 L 310,135 L 300,125 Z" />
      <path d="M 300,125 L 310,135 L 380,135 L 370,125 Z" />
      <path d="M 365,125 L 375,135 L 470,135 L 460,125 Z" />
    </g>

    <!-- TOP "Yalla" White Outer Outline Contour -->
    <g stroke="#FFFFFF" stroke-width="14" stroke-linejoin="round" fill="none">
      <path d="M 45,115 L 70,45 L 105,45 L 90,85 L 120,45 L 150,45 L 105,125 L 70,125 Z" />
      <path d="M 140,125 L 170,70 L 210,70 L 215,60 L 185,60 L 195,45 L 235,45 L 205,125 L 175,125 L 185,100 L 155,100 Z" />
      <path d="M 230,125 L 260,45 L 295,45 L 270,110 L 310,110 L 300,125 Z" />
      <path d="M 300,125 L 330,45 L 365,45 L 340,110 L 380,110 L 370,125 Z" />
      <path d="M 365,125 L 395,70 L 435,70 L 440,60 L 410,60 L 420,45 L 460,45 L 430,125 L 400,125 L 410,100 L 380,100 Z" />
    </g>

    <!-- TOP "Yalla" Yellow Main Text Fill -->
    <g fill="#FFC700" stroke="#CC1F00" stroke-width="3" stroke-linejoin="round">
      <path d="M 45,115 L 70,45 L 105,45 L 90,85 L 120,45 L 150,45 L 105,125 L 70,125 Z" />
      <path d="M 140,125 L 170,70 L 210,70 L 215,60 L 185,60 L 195,45 L 235,45 L 205,125 L 175,125 L 185,100 L 155,100 Z" />
      <path d="M 230,125 L 260,45 L 295,45 L 270,110 L 310,110 L 300,125 Z" />
      <path d="M 300,125 L 330,45 L 365,45 L 340,110 L 380,110 L 370,125 Z" />
      <path d="M 365,125 L 395,70 L 435,70 L 440,60 L 410,60 L 420,45 L 460,45 L 430,125 L 400,125 L 410,100 L 380,100 Z" />
    </g>

    <!-- BOTTOM "Yalla" Stacked Group (Offset y=90px) -->
    <g transform="translate(-10, 90)">
      
      <!-- BOTTOM "Yalla" 3D Shadow / Red-Orange Extrusion Block -->
      <g fill="#D82300" stroke="#A01500" stroke-width="2" stroke-linejoin="round">
        <path d="M 45,115 L 55,125 L 115,125 L 155,55 L 145,45 Z" />
        <path d="M 140,125 L 150,135 L 245,135 L 235,125 Z" />
        <path d="M 230,125 L 240,135 L 310,135 L 300,125 Z" />
        <path d="M 300,125 L 310,135 L 380,135 L 370,125 Z" />
        <path d="M 365,125 L 375,135 L 470,135 L 460,125 Z" />
      </g>

      <!-- BOTTOM "Yalla" White Outer Outline Contour -->
      <g stroke="#FFFFFF" stroke-width="14" stroke-linejoin="round" fill="none">
        <path d="M 45,115 L 70,45 L 105,45 L 90,85 L 120,45 L 150,45 L 105,125 L 70,125 Z" />
        <path d="M 140,125 L 170,70 L 210,70 L 215,60 L 185,60 L 195,45 L 235,45 L 205,125 L 175,125 L 185,100 L 155,100 Z" />
        <path d="M 230,125 L 260,45 L 295,45 L 270,110 L 310,110 L 300,125 Z" />
        <path d="M 300,125 L 330,45 L 365,45 L 340,110 L 380,110 L 370,125 Z" />
        <path d="M 365,125 L 395,70 L 435,70 L 440,60 L 410,60 L 420,45 L 460,45 L 430,125 L 400,125 L 410,100 L 380,100 Z" />
      </g>

      <!-- BOTTOM "Yalla" Yellow Main Text Fill -->
      <g fill="#FFC700" stroke="#CC1F00" stroke-width="3" stroke-linejoin="round">
        <path d="M 45,115 L 70,45 L 105,45 L 90,85 L 120,45 L 150,45 L 105,125 L 70,125 Z" />
        <path d="M 140,125 L 170,70 L 210,70 L 215,60 L 185,60 L 195,45 L 235,45 L 205,125 L 175,125 L 185,100 L 155,100 Z" />
        <path d="M 230,125 L 260,45 L 295,45 L 270,110 L 310,110 L 300,125 Z" />
        <path d="M 300,125 L 330,45 L 365,45 L 340,110 L 380,110 L 370,125 Z" />
        <path d="M 365,125 L 395,70 L 435,70 L 440,60 L 410,60 L 420,45 L 460,45 L 430,125 L 400,125 L 410,100 L 380,100 Z" />
      </g>

    </g>
  </g>
</svg>
